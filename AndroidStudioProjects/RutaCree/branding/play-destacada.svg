<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A6BBE"/><stop offset="1" stop-color="#244A8A"/></linearGradient></defs>
<rect width="1024" height="500" fill="url(#g)"/>
<path d="M0 430 C 300 380, 724 380, 1024 430 L1024 500 L0 500 Z" fill="#1E3F78"/>
<path d="M0 462 C 300 414, 724 414, 1024 462" stroke="#D91178" stroke-width="12" fill="none"/>
<g transform="translate(40,-40) scale(0.55)">
  <!-- Bus front, centred; everything stays inside the adaptive-icon safe circle (r≈340). -->
  <g>
    <!-- mirrors -->
    <rect x="300" y="380" width="26" height="92" rx="13" fill="#FFFFFF"/>
    <rect x="698" y="380" width="26" height="92" rx="13" fill="#FFFFFF"/>
    <!-- wheels -->
    <rect x="374" y="666" width="78" height="96" rx="24" fill="#1B3566"/>
    <rect x="572" y="666" width="78" height="96" rx="24" fill="#1B3566"/>
    <!-- body -->
    <rect x="340" y="262" width="344" height="438" rx="64" fill="#FFFFFF"/>
    <!-- route sign (magenta DIF) -->
    <rect x="388" y="294" width="248" height="52" rx="18" fill="#D91178"/>
    <!-- windshield -->
    <rect x="374" y="372" width="276" height="170" rx="30" fill="#2F5DA8"/>
    <!-- accessibility symbol in the windshield -->
    <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M498 420 L492 468 L540 468 L556 512 L572 506"/>
      <path d="M470 446 A44 44 0 1 0 540 500"/>
    </g>
    <circle cx="501" cy="397" r="15" fill="#FFFFFF"/>
    <!-- headlights -->
    <circle cx="410" cy="614" r="30" fill="#F8C817"/>
    <circle cx="614" cy="614" r="30" fill="#F8C817"/>
    <!-- grille -->
    <rect x="470" y="600" width="84" height="28" rx="14" fill="#C9D6EE"/>
  </g>
</g>
<text x="470" y="220" font-family="Noto Sans, Roboto, sans-serif" font-weight="800" font-size="92" fill="#FFFFFF">RutaCree</text>
<text x="474" y="282" font-family="Noto Sans, Roboto, sans-serif" font-weight="500" font-size="34" fill="#E6ECF8">Ruta Azul · transporte accesible</text>
<text x="474" y="326" font-family="Noto Sans, Roboto, sans-serif" font-weight="500" font-size="34" fill="#E6ECF8">Mira tu camión en tiempo real</text>
</svg>