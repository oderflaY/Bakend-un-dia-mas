<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Un Día Más">
  <title>Un Día Más — capa de frente del icono adaptativo</title>

  <!--
    La capa de frente del icono de Android. Es el dibujo de logo.svg reencuadrado.
    Sin fondo: el fondo es la otra capa.

    Por qué no vale usar logo.svg tal cual: en un icono adaptativo, el sistema
    solo garantiza que se vea el 66% central (un círculo de radio 338 sobre este
    lienzo de 1024). En logo.svg el horizonte mide 672 de ancho y está por debajo
    del centro, donde ese círculo ya se ha estrechado: con máscara redonda, los
    dos extremos de la línea se cortarían.

    El arreglo es una sola transformación: centrar el dibujo y encogerlo al 85%.
    El contenido ocupa de (176,340) a (848,650), o sea centro (512,495) y media
    diagonal 370; al 85% queda en 314, que cabe holgado en los 338 del círculo.

        translate(512,512) · scale(0.85) · translate(-512,-495)

    que colapsa en el translate(76.8, 91.25) scale(0.85) de abajo.
  -->

  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF8C42"/>
    </linearGradient>

    <radialGradient id="resplandor" cx="512" cy="640" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#FF9A3C" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(76.8, 91.25) scale(0.85)">
    <path d="M 132 640 A 380 380 0 0 1 892 640 Z" fill="url(#resplandor)"/>
    <path d="M 322 640 A 190 190 0 0 1 702 640 Z" fill="url(#sol)"/>

    <g stroke="#FFD166" stroke-width="22" stroke-linecap="round">
      <line x1="720.4" y1="542.8" x2="783.9" y2="513.2"/>
      <line x1="618.2" y1="436.0" x2="650.5" y2="373.9"/>
      <line x1="512.0" y1="410.0" x2="512.0" y2="340.0"/>
      <line x1="405.8" y1="436.0" x2="373.5" y2="373.9"/>
      <line x1="303.6" y1="542.8" x2="240.1" y2="513.2"/>
    </g>

    <rect x="176" y="628" width="672" height="22" rx="11" fill="#F7C873"/>
  </g>
</svg>
